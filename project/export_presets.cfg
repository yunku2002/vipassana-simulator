html/head_include="<script>(function(){var message='In-app browsers may not support this game correctly.\\n앱 내 브라우저에서는 제대로 작동하지 않을 수 있습니다.';var pending=[];function show(err){var n=document.getElementById('status-notice'),s=document.getElementById('status'),t=(err&&err.stack)?String(err.stack):String(err);if(!n||!s){pending.push(t);console.error(t);return;}s.style.visibility='visible';n.style.display='block';n.textContent='Startup error:\\n'+t;}window.addEventListener('error',function(e){show(e.error||e.message)});window.addEventListener('unhandledrejection',function(e){show(e.reason)});window.__showBootError=show;function init(){var s=document.getElementById('status');if(!s)return;var w=document.createElement('div');w.id='compat-warning';w.textContent=message;w.style.cssText='position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);box-sizing:border-box;padding:8px 12px;background:rgba(0,0,0,.62);color:#fff;font:14px/1.35 sans-serif;text-align:center;white-space:pre-line;border-radius:8px;';s.appendChild(w);pending.splice(0).forEach(show);}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();})();</script>"
